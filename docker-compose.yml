# Optional local container. The Python launcher is the simplest supported path.
services:
  research:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BIOTECH_OUTPUT_DIR: /app/output
    volumes:
      - ./output:/app/output:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
